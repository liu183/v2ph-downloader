name: Send Downloads to Feishu

on:
  schedule:
    # 每天 3 次 (UTC): 01:15, 09:15, 17:15
    # 对应北京时间: 09:15, 17:15, 次日 01:15
    - cron: "15 1,9,17 * * *"
  workflow_dispatch:
    inputs:
      sites:
        description: "Sites to send (comma-separated, or 'all')"
        required: false
        default: "all"

env:
  PYTHONIOENCODING: utf-8

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Send to Feishu
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: |
          SITES="${{ inputs.sites || 'all' }}"

          if [ "$SITES" = "all" ]; then
            SITE_DIRS="images/*/"
          else
            SITE_DIRS=""
            IFS=',' read -ra ADDR <<< "$SITES"
            for site in "${ADDR[@]}"; do
              site=$(echo "$site" | xargs)  # trim whitespace
              SITE_DIRS="$SITE_DIRS images/$site/"
            done
          fi

          for site_dir in $SITE_DIRS; do
            [ -d "$site_dir" ] || continue
            site_name=$(basename "$site_dir")

            img_count=$(find "$site_dir" -type f \( -name "*.jpg" -o -name "*.png" -o -name "*.jpeg" -o -name "*.webp" \) | wc -l)
            if [ "$img_count" -eq 0 ]; then
              echo "No images in $site_name, skipping"
              continue
            fi

            echo "Sending $site_name ($img_count images)..."
            python send_feishu.py --input "$site_dir" --source "$site_name"
            sleep 2
          done
