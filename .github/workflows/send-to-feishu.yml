name: Send Downloads to Feishu

on:
  workflow_dispatch:
    inputs:
      sites:
        description: "Sites to send (comma-separated, or 'all')"
        required: false
        default: "all"
  workflow_run:
    workflows:
      - "Download erotok Albums"
      - "Download bestgirlsexy Albums"
      - "Download everiaclub Albums"
      - "Download hotgirl Albums"
      - "Download geinou-nude Albums"
      - "Download eropuru Albums"
    types:
      - completed

env:
  PYTHONIOENCODING: utf-8

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Send to Feishu
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: |
          SITES="${{ inputs.sites || 'all' }}"

          if [ "$SITES" = "all" ]; then
            SITE_DIRS="images/*/"
          else
            SITE_DIRS=""
            IFS=',' read -ra ADDR <<< "$SITES"
            for site in "${ADDR[@]}"; do
              site=$(echo "$site" | xargs)  # trim whitespace
              SITE_DIRS="$SITE_DIRS images/$site/"
            done
          fi

          for site_dir in $SITE_DIRS; do
            [ -d "$site_dir" ] || continue
            site_name=$(basename "$site_dir")

            img_count=$(find "$site_dir" -type f \( -name "*.jpg" -o -name "*.png" -o -name "*.jpeg" -o -name "*.webp" \) | wc -l)
            if [ "$img_count" -eq 0 ]; then
              echo "No images in $site_name, skipping"
              continue
            fi

            echo "Sending $site_name ($img_count images)..."
            python send_feishu.py --input "$site_dir" --source "$site_name"
            sleep 2
          done
