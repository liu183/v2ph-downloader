name: Download eropuru Albums

on:
  schedule:
    - cron: "50 * * * *"
  workflow_dispatch:
    inputs:
      model_id:
        description: "Model page ID (from URL: /zyoyu/ID.html)"
        required: true
        default: "41602"
      list_only:
        description: "Only list images, don't download"
        required: false
        type: boolean
        default: false
      force_redownload:
        description: "Force re-download (skip incremental)"
        required: false
        type: boolean
        default: false

env:
  PYTHONIOENCODING: utf-8

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: |
          MID="${{ inputs.model_id || '41602' }}"
          ARGS="--model-id $MID --output ./images/eropuru"

          if [ "${{ inputs.force_redownload }}" != "true" ]; then
            ARGS="$ARGS --incremental"
          fi

          if [ "${{ inputs.list_only }}" = "true" ]; then
            ARGS="$ARGS --list-only"
          fi

          python scraper_eropuru.py $ARGS

      - name: Commit images and manifest
        if: inputs.list_only == false
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/eropuru/ manifests/ || true
          if git diff --cached --quiet; then
            echo "No new images to commit"
          else
            new_files=$(git diff --cached --name-only --diff-filter=A | wc -l)
            git commit -m "eropuru: +${new_files} images [skip ci]"
            git pull --rebase
            git push
          fi
