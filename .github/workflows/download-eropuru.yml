name: Download eropuru Albums

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: "Model page ID (from URL: /zyoyu/ID.html)"
        required: true
        default: "41602"
      list_only:
        description: "Only list images, don't download"
        required: false
        type: boolean
        default: false

env:
  PYTHONIOENCODING: utf-8

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: |
          ARGS="--model-id ${{ inputs.model_id }} --output ./downloads/eropuru-${{ inputs.model_id }}"

          if [ "${{ inputs.list_only }}" = "true" ]; then
            ARGS="$ARGS --list-only"
          fi

          python scraper_eropuru.py $ARGS

      - name: Upload artifacts
        if: inputs.list_only == false
        uses: actions/upload-artifact@v4
        with:
          name: eropuru-${{ inputs.model_id }}-${{ github.run_number }}
          path: downloads/
          retention-days: 5
          if-no-files-found: warn
