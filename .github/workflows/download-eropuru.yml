name: Download eropuru Albums

on:
  schedule:
    - cron: "50 * * * *"
  workflow_dispatch:
    inputs:
      model_id:
        description: "Model page ID (from URL: /zyoyu/ID.html)"
        required: true
        default: "41602"
      list_only:
        description: "Only list images, don't download"
        required: false
        type: boolean
        default: false

env:
  PYTHONIOENCODING: utf-8

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: |
          MID="${{ inputs.model_id || '41602' }}"
          ARGS="--model-id $MID --output ./downloads/eropuru-$MID --incremental"

          if [ "${{ inputs.list_only }}" = "true" ]; then
            ARGS="$ARGS --list-only"
          fi

          python scraper_eropuru.py $ARGS

      - name: Upload artifacts
        if: inputs.list_only == false
        uses: actions/upload-artifact@v4
        with:
          name: eropuru-${{ inputs.model_id }}-${{ github.run_number }}
          path: downloads/
          retention-days: 5
          if-no-files-found: warn

      - name: Commit manifest
        if: inputs.list_only == false
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifests/ || true
          if git diff --cached --quiet; then
            echo "No manifest changes to commit"
          else
            git commit -m "Update manifest: eropuru ${{ inputs.model_id }} [skip ci]"
            git push
          fi
