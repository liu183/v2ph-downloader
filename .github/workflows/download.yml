name: Download v2ph Albums

on:
  workflow_dispatch:
    inputs:
      actor:
        description: "Actor slug (from URL: v2ph.com/actor/XXX)"
        required: true
        default: "Shirato-Hana"
      full_pages:
        description: "Fetch all pages (requires V2PH_COOKIES secret)"
        required: false
        type: boolean
        default: false
      list_only:
        description: "Only list albums, don't download"
        required: false
        type: boolean
        default: false

env:
  PYTHONIOENCODING: utf-8

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        env:
          V2PH_COOKIES: ${{ secrets.V2PH_COOKIES }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          ARGS="--actor ${{ inputs.actor }} --output ./downloads/${{ inputs.actor }}"

          if [ "${{ inputs.full_pages }}" = "true" ]; then
            ARGS="$ARGS --full"
          fi

          if [ "${{ inputs.list_only }}" = "true" ]; then
            ARGS="$ARGS --list-only"
          fi

          python scraper.py $ARGS

      - name: Upload artifacts
        if: inputs.list_only == false
        uses: actions/upload-artifact@v4
        with:
          name: v2ph-${{ inputs.actor }}-${{ github.run_number }}
          path: downloads/
          retention-days: 5
          if-no-files-found: warn
