name: Download geinou-nude Albums

on:
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch:
    inputs:
      model:
        description: "Model name (from URL: geinou-nude.com/MODEL/)"
        required: true
        default: "白桃はな"
      list_only:
        description: "Only list images, don't download"
        required: false
        type: boolean
        default: false

env:
  PYTHONIOENCODING: utf-8

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: |
          ARGS="--model ${{ inputs.model }} --output ./downloads/geinou-nude-${{ inputs.model }} --incremental"

          if [ "${{ inputs.list_only }}" = "true" ]; then
            ARGS="$ARGS --list-only"
          fi

          python scraper_geinou_nude.py $ARGS

      - name: Upload artifacts
        if: inputs.list_only == false
        uses: actions/upload-artifact@v4
        with:
          name: geinou-nude-${{ inputs.model }}-${{ github.run_number }}
          path: downloads/
          retention-days: 5
          if-no-files-found: warn

      - name: Commit manifest
        if: inputs.list_only == false
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifests/ || true
          if git diff --cached --quiet; then
            echo "No manifest changes to commit"
          else
            git commit -m "Update manifest: geinou-nude ${{ inputs.model }} [skip ci]"
            git push
          fi
