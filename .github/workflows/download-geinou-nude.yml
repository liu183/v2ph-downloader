name: Download geinou-nude Albums

on:
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch:
    inputs:
      model:
        description: "Model name (from URL: geinou-nude.com/MODEL/)"
        required: true
        default: "白桃はな"
      list_only:
        description: "Only list images, don't download"
        required: false
        type: boolean
        default: false

env:
  PYTHONIOENCODING: utf-8

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: |
          MODEL="${{ inputs.model || '白桃はな' }}"
          ARGS="--model $MODEL --output ./images/geinou-nude --incremental"

          if [ "${{ inputs.list_only }}" = "true" ]; then
            ARGS="$ARGS --list-only"
          fi

          python scraper_geinou_nude.py $ARGS

      - name: Commit images and manifest
        if: inputs.list_only == false
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/geinou-nude/ manifests/ || true
          if git diff --cached --quiet; then
            echo "No new images to commit"
          else
            new_files=$(git diff --cached --name-only --diff-filter=A | wc -l)
            git commit -m "geinou-nude: +${new_files} images [skip ci]"
            git push
          fi
