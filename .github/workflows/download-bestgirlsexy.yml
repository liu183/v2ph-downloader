name: Download bestgirlsexy Albums

on:
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag slug (from URL: bestgirlsexy.com/tag/XXX/)"
        required: true
        default: "shirato-hana"
      tag_id:
        description: "WordPress tag ID (leave 0 to auto-resolve)"
        required: false
        default: "0"
      list_only:
        description: "Only list albums, don't download"
        required: false
        type: boolean
        default: false

env:
  PYTHONIOENCODING: utf-8

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: |
          TAG="${{ inputs.tag || 'shirato-hana' }}"
          ARGS="--tag $TAG --output ./downloads/bestgirlsexy-$TAG --incremental"

          if [ "${{ inputs.tag_id || '0' }}" != "0" ]; then
            ARGS="$ARGS --tag-id ${{ inputs.tag_id || '0' }}"
          fi

          if [ "${{ inputs.list_only }}" = "true" ]; then
            ARGS="$ARGS --list-only"
          fi

          python scraper_bestgirlsexy.py $ARGS

      - name: Upload artifacts
        if: inputs.list_only == false
        uses: actions/upload-artifact@v4
        with:
          name: bestgirlsexy-${{ inputs.tag }}-${{ github.run_number }}
          path: downloads/
          retention-days: 5
          if-no-files-found: warn

      - name: Commit manifest
        if: inputs.list_only == false
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifests/ || true
          if git diff --cached --quiet; then
            echo "No manifest changes to commit"
          else
            git commit -m "Update manifest: bestgirlsexy ${{ inputs.tag }} [skip ci]"
            git push
          fi
