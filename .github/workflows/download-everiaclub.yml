name: Download everiaclub Albums

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
    inputs:
      keyword:
        description: "Search keyword (e.g. 白桃はな)"
        required: true
        default: "白桃はな"
      list_only:
        description: "Only list albums, don't download"
        required: false
        type: boolean
        default: false
      force_redownload:
        description: "Force re-download (skip incremental)"
        required: false
        type: boolean
        default: false

env:
  PYTHONIOENCODING: utf-8

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 cloudscraper playwright
          python -m playwright install --with-deps chromium

      - name: Wait for FlareSolverr
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:8191/healthz > /dev/null 2>&1; then
              echo "FlareSolverr is ready"
              exit 0
            fi
            echo "Waiting for FlareSolverr... ($i/30)"
            sleep 2
          done
          echo "FlareSolverr failed to start"
          exit 1

      - name: Run scraper
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FLARESOLVERR_URL: http://localhost:8191/v1
        run: |
          KW="${{ inputs.keyword || '白桃はな' }}"
          ARGS="--keyword $KW --output ./images/everiaclub"

          if [ "${{ inputs.force_redownload }}" != "true" ]; then
            ARGS="$ARGS --incremental"
          fi

          if [ "${{ inputs.list_only }}" = "true" ]; then
            ARGS="$ARGS --list-only"
          fi

          python scraper_everiaclub.py $ARGS

      - name: Commit images and manifest
        if: inputs.list_only == false
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/everiaclub/ manifests/ || true
          if git diff --cached --quiet; then
            echo "No new images to commit"
          else
            new_files=$(git diff --cached --name-only --diff-filter=A | wc -l)
            git commit -m "everiaclub: +${new_files} images [skip ci]"
            git pull --rebase
            git push
          fi
