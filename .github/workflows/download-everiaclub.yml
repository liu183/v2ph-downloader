name: Download everiaclub Albums

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
    inputs:
      keyword:
        description: "Search keyword (e.g. 白桃はな)"
        required: true
        default: "白桃はな"
      list_only:
        description: "Only list albums, don't download"
        required: false
        type: boolean
        default: false

env:
  PYTHONIOENCODING: utf-8

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 cloudscraper playwright
          python -m playwright install --with-deps chromium

      - name: Wait for FlareSolverr
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:8191/healthz > /dev/null 2>&1; then
              echo "FlareSolverr is ready"
              exit 0
            fi
            echo "Waiting for FlareSolverr... ($i/30)"
            sleep 2
          done
          echo "FlareSolverr failed to start"
          exit 1

      - name: Run scraper
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FLARESOLVERR_URL: http://localhost:8191/v1
        run: |
          KW="${{ inputs.keyword || '白桃はな' }}"
          ARGS="--keyword $KW --output ./downloads/everiaclub-$KW --incremental"

          if [ "${{ inputs.list_only }}" = "true" ]; then
            ARGS="$ARGS --list-only"
          fi

          python scraper_everiaclub.py $ARGS

      - name: Upload artifacts
        if: inputs.list_only == false
        uses: actions/upload-artifact@v4
        with:
          name: everiaclub-${{ inputs.keyword }}-${{ github.run_number }}
          path: downloads/
          retention-days: 5
          if-no-files-found: warn

      - name: Commit manifest
        if: inputs.list_only == false
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifests/ || true
          if git diff --cached --quiet; then
            echo "No manifest changes to commit"
          else
            git commit -m "Update manifest: everiaclub ${{ inputs.keyword }} [skip ci]"
            git push
          fi
