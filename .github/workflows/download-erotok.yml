name: Download erotok Albums

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to search (e.g. 白桃はな)"
        required: true
        default: "白桃はな"
      list_only:
        description: "Only list albums, don't download"
        required: false
        type: boolean
        default: false

env:
  PYTHONIOENCODING: utf-8

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 cloudscraper playwright
          python -m playwright install --with-deps chromium

      - name: Run scraper
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: |
          TAG="${{ inputs.tag || '白桃はな' }}"
          ARGS="--tag $TAG --output ./images/erotok --incremental"

          if [ "${{ inputs.list_only }}" = "true" ]; then
            ARGS="$ARGS --list-only"
          fi

          python scraper_erotok.py $ARGS

      - name: Commit images and manifest
        if: inputs.list_only == false
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/erotok/ manifests/ || true
          if git diff --cached --quiet; then
            echo "No new images to commit"
          else
            new_files=$(git diff --cached --name-only --diff-filter=A | wc -l)
            git commit -m "erotok: +${new_files} images [skip ci]"
            git pull --rebase
            git push
          fi
